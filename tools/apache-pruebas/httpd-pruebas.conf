# Configuración de pruebas: /dist servido para los 4 hosts por HTTP (80) y HTTPS (443),
# con .htaccess activado (AllowOverride All), como en un hosting compartido.

Listen 443
ServerName brototermic.com

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html

<VirtualHost *:80>
    ServerName brototermic.com
    ServerAlias www.brototermic.com brototermic.es www.brototermic.es
    DocumentRoot "/usr/local/apache2/htdocs"
</VirtualHost>

<VirtualHost *:443>
    ServerName brototermic.com
    ServerAlias www.brototermic.com brototermic.es www.brototermic.es
    DocumentRoot "/usr/local/apache2/htdocs"
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/server.key"
</VirtualHost>

# Log de reescritura (útil si una regla no hace lo esperado: docker compose logs)
LogLevel warn rewrite:trace2
