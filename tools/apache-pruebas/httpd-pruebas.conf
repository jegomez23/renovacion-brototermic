# Configuración de pruebas, COMO EN PRODUCCIÓN: dos vhosts con docroots DISTINTOS.
#   - brototermic.com y www.brototermic.com → /dist     (montado en htdocs-com)
#   - brototermic.es  y www.brototermic.es  → /dist-es  (montado en htdocs-es)
# Por HTTP (80) y HTTPS (443), con .htaccess activado (AllowOverride All), como en un hosting compartido.
# Para probar además el caso de un hosting que solo permite FileInfo (el mínimo que necesitan las redirecciones),
# se puede cambiar «AllowOverride All» por «AllowOverride FileInfo»: el .htaccess debe seguir funcionando.

Listen 443
ServerName brototermic.com

<Directory "/usr/local/apache2/htdocs-com">
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory "/usr/local/apache2/htdocs-es">
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# ---------- .com ----------
<VirtualHost *:80>
    ServerName brototermic.com
    ServerAlias www.brototermic.com
    DocumentRoot "/usr/local/apache2/htdocs-com"
</VirtualHost>
<VirtualHost *:443>
    ServerName brototermic.com
    ServerAlias www.brototermic.com
    DocumentRoot "/usr/local/apache2/htdocs-com"
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/server.key"
</VirtualHost>

# ---------- .es (otro docroot) ----------
<VirtualHost *:80>
    ServerName brototermic.es
    ServerAlias www.brototermic.es
    DocumentRoot "/usr/local/apache2/htdocs-es"
</VirtualHost>
<VirtualHost *:443>
    ServerName brototermic.es
    ServerAlias www.brototermic.es
    DocumentRoot "/usr/local/apache2/htdocs-es"
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/server.key"
</VirtualHost>

# Log de reescritura (útil si una regla no hace lo esperado: docker compose logs)
LogLevel warn rewrite:trace2 alias:debug
